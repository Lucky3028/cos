version: 2

project_name: cos

builds:
  - id: cos
    main: ./cmd/cos
    binary: cos
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/Lucky3028/cos/internal/appserver.Version={{ .Version }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - third_party_licenses/**/*

checksum:
  name_template: checksums.txt
